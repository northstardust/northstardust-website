<!DOCTYPE html>
<html lang="en-GB">
<!--
  North Stardust — publishing.html

  A completely separate page. It reuses the background system, the transparent
  Header, the Footer treatment and the Hero Message typography.
  It is NOT a seventh Home state.
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>North Stardust — Publishing</title>
  <meta name="description" content="North Stardust's published work. Coming soon.">
  <link rel="canonical" href="https://northstardust.studio/publishing.html">
  <meta name="theme-color" content="#0F172A">
  <meta name="author" content="Athanasios Zagkliveris">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="North Stardust">
  <meta property="og:url" content="https://northstardust.studio/publishing.html">
  <meta property="og:title" content="North Stardust — Publishing">
  <meta property="og:description" content="North Stardust's published work. Coming soon.">
  <meta property="og:image" content="https://northstardust.studio/assets/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <!--
    Only the faces this page actually renders. The full set is preloaded on
    the Home page, which needs all five; this page sets its heading in
    Cormorant, its body in Spectral and its navigation in Inter 500, and
    nothing on it is Inter 400 or 600. The consent banner - the one other
    thing that would call for Inter 400 - is Home-only, gated on the
    data-analytics attribute that no other page carries.

    Preloading is a hint, not a dependency: a face left out here still loads
    if something later asks for it.
  -->
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/cormorant-400.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/spectral-400.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-500.woff2" crossorigin>

  <link rel="stylesheet" href="styles.css">
  <script>document.documentElement.classList.add("js");</script>
  <script src="main.js" defer></script>
</head>

<body class="publishing-body">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="page-bg" aria-hidden="true">
    <div class="page-bg__stars"></div>
    <div class="page-bg__fade"></div>
    <div class="page-bg__glow"></div>
  </div>

  <header class="site-header" data-site-header>
    <div class="site-header__inner">
      <a
        class="site-header__logo"
        href="index.html#hero"
        aria-label="North Stardust — Home"
      >
        <picture>
          <source
            srcset="assets/img/logo-single-line.svg"
            media="(max-width: 767px)"
            width="240"
            height="60"
          >
          <img
            src="assets/img/logo-double-line.svg"
            width="240"
            height="100"
            alt="North Stardust"
            decoding="async"
          >
        </picture>
      </a>

      <nav class="site-header__nav" aria-label="Primary navigation">
        <a href="index.html#studio">STUDIO</a>
        <a href="publishing.html" aria-current="page">PUBLISHING</a>
        <a href="index.html#founder">ABOUT</a>
        <a class="contact-link" href="index.html#contact">CONTACT</a>
      </nav>

      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="mobile-navigation"
        aria-label="Open navigation"
        data-menu-toggle
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>

      <nav
        id="mobile-navigation"
        class="mobile-nav"
        aria-label="Mobile navigation"
        hidden
      >
        <a href="index.html#studio">STUDIO</a>
        <a href="publishing.html" aria-current="page">PUBLISHING</a>
        <a href="index.html#founder">ABOUT</a>
        <a href="index.html#contact">CONTACT</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="publishing-page" tabindex="-1">
    <h1 class="publishing-placeholder__title" data-content="publishing.message">
      Coming soon...
    </h1>
  </main>

  <footer class="site-footer publishing-footer">
    <div class="site-footer__inner">
      <div class="site-footer__logo" aria-hidden="true">
        <img
          src="assets/img/logo-single-line.svg"
          width="240"
          height="60"
          alt=""
          decoding="async"
        >
      </div>

      <a
        class="site-footer__linkedin"
        href="https://www.linkedin.com/company/northstardust"
        target="_blank"
        rel="noopener noreferrer"
      >
        LINKEDIN
      </a>

      <a class="site-footer__privacy" href="privacy.html">Privacy Policy</a>

      <p class="site-footer__legal" data-content="footer.copyright">© 2026 North Stardust Studio</p>
    </div>
  </footer>
</body>
</html>
